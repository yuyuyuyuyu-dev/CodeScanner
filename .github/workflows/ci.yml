name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  oxfmt:
    name: Oxfmt
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/oxfmt.yml@main
  kotlin-lint:
    name: Kotlin lint
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/kotlin-lint.yml@main
  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main
      - run: ./gradlew testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
